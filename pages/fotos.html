<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aqui, Bibia • Nossos momentos</title>

    <link rel="stylesheet" href="../src/css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <h1>📷 Nossos momentos</h1>
        <p>Um cantinho pra guardar as nossas melhores lembranças.</p>
    </header>

    <main>

        <section class="card">
            <h2>➕ Guardar um momento</h2>

            <label class="upload-label" for="foto-momento">
                📷 Escolher foto
            </label>
            <input type="file" id="foto-momento" accept="image/*" hidden>

            <div id="preview-momento" class="foto-grid" style="display:none;"></div>

            <div class="form-coluna">
                <input type="text" id="legenda-momento" maxlength="80"
                    placeholder="Legenda (ex: nosso primeiro açaí juntos 💜)">
                <button id="btn-salvar-momento" class="btn-primary btn-big" disabled>
                    💙 Guardar momento
                </button>
            </div>
        </section>

        <section class="card">
            <h2>🖼️ Galeria</h2>
            <div id="galeria-momentos" class="galeria">
                <p class="empty-message">Ainda não tem fotos por aqui. Vamos começar a nossa coleção? 💙</p>
            </div>
        </section>

    </main>

    <nav>
        <a href="../index.html" aria-label="Início">🏠</a>
        <a href="treinos.html" aria-label="Treinos">💪</a>
        <a href="dieta.html" aria-label="Dieta">🥗</a>
        <a href="estudos.html" aria-label="Estudos">📚</a>
        <a href="agenda.html" aria-label="Agenda">📅</a>
        <a href="fotos.html" class="ativo" aria-label="Nossos momentos">📷</a>
        <a href="recados.html" aria-label="Recados">💌</a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

    <script src="../src/js/firebase.js"></script>
    <script src="../src/js/auth.js"></script>
    <script src="../src/js/app.js"></script>
    <script src="../src/js/momentos.js"></script>

</body>
</html>
