<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aqui, Bibia • Recados</title>

    
    <link rel="icon" type="image/png" href="../src/img/favicon.png">
    <link rel="apple-touch-icon" href="../src/img/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#6366f1">

    <link rel="stylesheet" href="../src/css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <h1>💌 Recados</h1>
        <p>Bilhetinhos guardados com carinho, de um pro outro.</p>
    </header>

    <main>

        <section class="card">
            <h2>📬 Para você</h2>
            <div id="lista-recebidos">
                <p class="empty-message">Carregando bilhetes... 💙</p>
            </div>
        </section>

        <section class="card">
            <h2>✏️ Escrever um bilhete</h2>
            <p id="para-quem" class="hint"></p>
            <div class="form-coluna">
                <textarea id="texto-recado" rows="3" maxlength="500"
                    placeholder="Escreve aqui algo bonito..."></textarea>
                <button id="btn-add-recado" class="btn-primary btn-big">💌 Enviar bilhete</button>
            </div>
        </section>

        <section class="card">
            <h2>📤 Enviados por você</h2>
            <div id="lista-enviados">
                <p class="empty-message">Você ainda não mandou nenhum bilhete. ✨</p>
            </div>
        </section>

    </main>

    <nav>
        <a href="../index.html" aria-label="Início">🏠</a>
        <a href="treinos.html" aria-label="Treinos">💪</a>
        <a href="dieta.html" aria-label="Dieta">🥗</a>

        <a href="agenda.html" aria-label="Agenda">📅</a>
        <a href="fotos.html" aria-label="Nossos momentos">📷</a>
        <a href="recados.html" class="ativo" aria-label="Recados">💌</a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

    <script src="../src/js/firebase.js"></script>
    <script src="../src/js/auth.js"></script>
    <script src="../src/js/app.js"></script>
    <script src="../src/js/recados.js"></script>

</body>
</html>
