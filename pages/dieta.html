<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aqui, Bibia • Dieta</title>

    
    <link rel="icon" type="image/png" href="../src/img/favicon.png">
    <link rel="apple-touch-icon" href="../src/img/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#6366f1">

    <link rel="stylesheet" href="../src/css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <h1>🥗 Dieta</h1>
        <p>Cuidar da alimentação também é um ato de carinho com você.</p>
    </header>

    <main>

        <section class="card">
            <h2>✅ Checklist de hoje <span id="dieta-data" class="hint"></span></h2>

            <p class="hint">Toque na refeição pra marcar e contar o que comeu!</p>
            <div class="checklist" id="checklist-dieta"></div>

            <p id="dieta-status" class="hint"></p>
        </section>

        <section class="card">
            <h2>📸 Fotos das refeições</h2>
            <p class="hint">Escolha de qual refeição é a foto e capricha no prato!</p>

            <select id="tipo-foto" class="tipo-select">
                <option>Café da manhã</option>
                <option>Almoço</option>
                <option>Café da tarde</option>
                <option>Janta</option>
                <option>Água</option>
            </select>

            <label class="upload-label" for="foto-dieta">
                📷 Adicionar foto
            </label>
            <input type="file" id="foto-dieta" accept="image/*" hidden>

            <div id="fotos-dieta" class="foto-grid"></div>
        </section>

        <section class="card">
            <h2>🗓️ Dias anteriores</h2>
            <div id="historico-dieta">
                <p class="empty-message">Os dias completos vão aparecer aqui 💙</p>
            </div>
        </section>

    </main>

    <nav>
        <a href="../index.html" aria-label="Início">🏠</a>
        <a href="treinos.html" aria-label="Treinos">💪</a>
        <a href="dieta.html" class="ativo" aria-label="Dieta">🥗</a>
        <a href="estudos.html" aria-label="Estudos">📚</a>
        <a href="agenda.html" aria-label="Agenda">📅</a>
        <a href="fotos.html" aria-label="Nossos momentos">📷</a>
        <a href="recados.html" aria-label="Recados">💌</a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

    <script src="../src/js/firebase.js"></script>
    <script src="../src/js/auth.js"></script>
    <script src="../src/js/app.js"></script>
    <script src="../src/js/dieta.js"></script>

</body>
</html>
